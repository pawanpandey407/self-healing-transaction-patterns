spring:
  application:
    name: transaction-pipeline
  task:
    scheduling:
      # The generator and the detection engine are both scheduled tasks.
      # On the default single-thread scheduler a generator that falls
      # behind starves detection completely: monitoring silenced by the
      # workload it watches. Detection gets its own thread.
      pool:
        size: 4

pipeline:
  generator:
    # 250ms gives each of the five clients about a dozen transactions per
    # 15 second detection window, enough for per-client ratios to mean something.
    interval-ms: 250
    clients: 5
  stages:
    validation:
      failure-probability: 0.005
      min-latency-ms: 5
      max-latency-ms: 20
    authorization:
      # 2% decline rate is the healthy baseline, not an anomaly.
      failure-probability: 0.02
      # Per-client override for injection scenarios. Break one client's
      # path while the fleet stays at baseline, for example:
      # client-failure-probability:
      #   client-3: 0.5
      min-latency-ms: 40
      max-latency-ms: 120
    settlement:
      failure-probability: 0.005
      min-latency-ms: 20
      max-latency-ms: 80

detection:
  # Two minutes of warmup at these defaults before any verdict can fire.
  window-ms: 15000
  warmup-windows: 8
  sigma: 3.0
  min-window-samples: 10
  ratio-floor: 0.05
  relative-floor: 0.3
  saturation-threshold: 0.9
  projection-horizon-seconds: 600
  cooldown-seconds: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
